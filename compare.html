<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparator | Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        const t = localStorage.getItem('theme') || 'system';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); }
    </script>
</head>
<body>

    <!-- Change class to set layout: nav-default | nav-left | nav-center | nav-side -->
<!-- Change class to: nav-right (Default), nav-left, or nav-center -->
<!-- Example Mix: Desktop Right Align + Mobile Top Drawer + Floating Container -->
<nav class="navbar nav-center drawer-right nav-bottom">
    <div class="nav-content">
        <!-- 1. Logo -->
        <a href="index.html" class="nav-logo uppercase tracking-widest">Comparator</a>
        
        <!-- 2. Nav Links & Theme Switcher (Combined for Mobile Drawer Support) -->
        <div class="nav-center-group" id="nav-center-group">
            <div class="nav-links uppercase tracking-widest">
                <a href="index.html" class="nav-link ">Home</a>
                <a href="compare.html" class="nav-link active">Compare</a>
                <a href="about.html" class="nav-link">About</a>
            </div>

            <!-- Modern Icon Theme Switcher -->
            <div class="theme-switcher-nav">
                <button id="theme-light" class="theme-icon-btn" aria-label="Light Theme">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button id="theme-dark" class="theme-icon-btn" aria-label="Dark Theme">
                    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button id="theme-system" class="theme-icon-btn" aria-label="System Theme">
                    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
            </div>
        </div>

        <!-- 3. Mobile Hamburger Toggle -->
        <div class="nav-actions">
            <button class="nav-toggle" id="mobile-menu-btn" aria-label="Toggle menu">
                <div class="hamburger">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                </div>
            </button>
        </div>
    </div>
</nav>

    <div class="container flex-grow" style="display: flex; flex-direction: column; gap: 2rem;">
        
        <header class="compare-header">
            <div>
                <h1 class="uppercase font-bold" style="font-size: 1.875rem;">Text Comparator</h1>
                <p class="text-muted" style="font-size: 0.875rem; margin-top: 0.25rem;">Analyze differences with precision.</p>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="compare-grid">
                <div class="textarea-group uppercase tracking-widest">
                    <label for="text-original" class="textarea-label text-muted">Original Text</label>
                    <textarea id="text-original" spellcheck="false" placeholder="Paste your original text here..." class="textarea font-mono"></textarea>
                </div>

                <div class="textarea-group uppercase tracking-widest">
                    <label for="text-modified" class="textarea-label text-muted">Modified Text</label>
                    <textarea id="text-modified" spellcheck="false" placeholder="Paste the modified version here..." class="textarea font-mono"></textarea>
                </div>
            </div>

            <div style="display: flex; justify-content: center; margin: 1rem 0;">
                <button id="compare-btn" class="btn-primary uppercase tracking-widest">Compare Texts</button>
            </div>

            <div id="results-container" class="hidden" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 3rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <label class="textarea-label text-muted uppercase tracking-widest">Comparison Result</label>
                    <div class="diff-legend font-mono uppercase">
                        <span class="diff-legend-item"><span class="diff-box add"></span> Additions</span>
                        <span class="diff-legend-item"><span class="diff-box del"></span> Deletions</span>
                    </div>
                </div>
                <div id="diff-output" class="card diff-output"></div>
            </div>
        </main>
    </div>

    <script src="script.js" defer></script>
    <script src="compare.js" defer></script>
</body>
</html>
