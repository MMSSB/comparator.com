<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Compare</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        function getThemePreference() {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) {
                return localStorage.getItem('theme');
            }
            return 'system';
        }
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        }
        applyTheme(getThemePreference());
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="nav-logo uppercase tracking-widest">Workspace</a>
            <div class="nav-links uppercase tracking-widest">
                <a href="index.html" class="nav-link">Home</a>
                <a href="compare.html" class="nav-link active">Compare</a>
                <a href="about.html" class="nav-link">About</a>
            </div>
        </div>
    </nav>

    <div class="container flex-grow" style="display: flex; flex-direction: column; gap: 2rem;">
        
        <header class="compare-header">
            <div>
                <h1 class="compare-title uppercase font-bold">Text Comparator</h1>
                <p class="text-muted" style="font-size: 0.875rem; margin-top: 0.25rem;">Analyze differences with precision.</p>
            </div>

            <div class="theme-switcher uppercase tracking-widest">
                <button onclick="setTheme('light')" id="btn-light" class="theme-btn">Light</button>
                <button onclick="setTheme('dark')" id="btn-dark" class="theme-btn">Dark</button>
                <button onclick="setTheme('system')" id="btn-system" class="theme-btn">System</button>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="compare-grid">
                <div class="textarea-group uppercase tracking-widest">
                    <label for="text-original" class="textarea-label text-muted">Original Text</label>
                    <textarea id="text-original" spellcheck="false" placeholder="Paste your original text here..." class="textarea font-mono"></textarea>
                </div>

                <div class="textarea-group uppercase tracking-widest">
                    <label for="text-modified" class="textarea-label text-muted">Modified Text</label>
                    <textarea id="text-modified" spellcheck="false" placeholder="Paste the modified version here..." class="textarea font-mono"></textarea>
                </div>
            </div>

            <div style="display: flex; justify-content: center; margin: 1rem 0;">
                <button id="compare-btn" class="btn-primary uppercase tracking-widest">Compare Texts</button>
            </div>

            <div id="results-container" class="hidden" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 3rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <label class="textarea-label text-muted uppercase tracking-widest">Comparison Result</label>
                    <div class="diff-legend font-mono uppercase">
                        <span class="diff-legend-item"><span class="diff-box add"></span> Additions</span>
                        <span class="diff-legend-item"><span class="diff-box del"></span> Deletions</span>
                    </div>
                </div>
                
                <div id="diff-output" class="card diff-output"></div>
            </div>
        </main>
    </div>

    <script>
        const themeButtons = {
            light: document.getElementById('btn-light'),
            dark: document.getElementById('btn-dark'),
            system: document.getElementById('btn-system')
        };

        function updateActiveButton(theme) {
            Object.values(themeButtons).forEach(btn => btn.classList.remove('active'));
            if(themeButtons[theme]) {
                themeButtons[theme].classList.add('active');
            }
        }

        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme(theme);
            updateActiveButton(theme);
        }

        updateActiveButton(getThemePreference());

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (getThemePreference() === 'system') applyTheme('system');
        });

        function tokenize(text) {
            return text.match(/(\w+|\s+|[^\w\s])/g) || [];
        }

        function computeDiff(oldStr, newStr) {
            const oldTokens = tokenize(oldStr);
            const newTokens = tokenize(newStr);
            const dp = Array(oldTokens.length + 1).fill(null).map(() => Array(newTokens.length + 1).fill(0));

            for (let i = 1; i <= oldTokens.length; i++) {
                for (let j = 1; j <= newTokens.length; j++) {
                    if (oldTokens[i - 1] === newTokens[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            let i = oldTokens.length, j = newTokens.length;
            const diff = [];

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && oldTokens[i - 1] === newTokens[j - 1]) {
                    diff.push({ type: 'equal', value: oldTokens[i - 1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    diff.push({ type: 'add', value: newTokens[j - 1] });
                    j--;
                } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                    diff.push({ type: 'remove', value: oldTokens[i - 1] });
                    i--;
                }
            }
            return diff.reverse();
        }

        const btnCompare = document.getElementById('compare-btn');
        const txtOriginal = document.getElementById('text-original');
        const txtModified = document.getElementById('text-modified');
        const resultsContainer = document.getElementById('results-container');
        const diffOutput = document.getElementById('diff-output');

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        btnCompare.addEventListener('click', () => {
            const original = txtOriginal.value;
            const modified = txtModified.value;

            if (!original && !modified) {
                diffOutput.innerHTML = '<span class="text-muted" style="font-style: italic;">Please provide text in both fields to see a comparison.</span>';
                resultsContainer.classList.remove('hidden');
                return;
            }

            const originalText = btnCompare.innerText;
            btnCompare.innerText = "COMPARING...";
            
            setTimeout(() => {
                const diff = computeDiff(original, modified);
                let htmlOutput = '';
                
                diff.forEach(part => {
                    const safeValue = escapeHtml(part.value);
                    if (part.type === 'add') htmlOutput += `<ins>${safeValue}</ins>`;
                    else if (part.type === 'remove') htmlOutput += `<del>${safeValue}</del>`;
                    else htmlOutput += safeValue;
                });

                diffOutput.innerHTML = htmlOutput || '<span class="text-muted" style="font-style: italic;">No differences found. The texts are identical.</span>';
                
                resultsContainer.classList.remove('hidden');
                resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                btnCompare.innerText = originalText;
            }, 50);
        });
    </script>
</body>
</html>
